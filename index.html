<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174ea6">
  <title>ConectaHub | Compartilhamento de Dados</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <script defer src="assets/js/data.js"></script>
  <script defer src="assets/js/request-form.js"></script>
  <script defer src="assets/js/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="ConectaHub início"><span class="brand-mark">C</span><span>ConectaHub<small>Compartilhamento de dados</small></span></a>
      <nav class="nav" aria-label="Navegação principal">
        <button class="nav-item active" data-route="dashboard"><span class="nav-icon">▦</span>Dashboard</button>
        <button class="nav-item" data-route="requests"><span class="nav-icon">↗</span>Solicitações <span class="nav-count" id="request-count">0</span></button>
        <button class="nav-item" data-route="datasets"><span class="nav-icon">▤</span>Conjuntos de dados</button>
        <button class="nav-item" data-route="orgs"><span class="nav-icon">▥</span>Órgãos e entidades</button>
        <button class="nav-item" data-route="reports"><span class="nav-icon">▥</span>Relatórios</button>
        <div class="nav-caption">ADMINISTRAÇÃO</div>
        <button class="nav-item" data-route="users"><span class="nav-icon">♙</span>Usuários e perfis</button>
      </nav>
      <div class="sidebar-bottom"><span class="status-dot"></span> Protótipo executável <small>Dados salvos neste navegador</small></div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobile-menu" aria-label="Abrir menu">☰</button>
        <div class="breadcrumbs"><span>ConectaHub</span><span class="crumb-sep">/</span><strong id="page-name">Dashboard</strong></div>
        <div class="topbar-actions"><span class="environment"><span class="status-dot"></span> Ambiente de demonstração</span><button class="avatar" title="Usuário atual">MC</button></div>
      </header>
      <section class="page-content" id="page-content" tabindex="-1"></section>
      <footer class="footer"><span>ConectaHub · Protótipo de compartilhamento e interoperabilidade</span><div><button class="text-button" id="import-backup">Importar backup</button> · <button class="text-button" id="export-backup">Exportar backup dos dados</button></div></footer>
    </main>
  </div>
  <div id="modal-root"></div><div id="toast-root" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
