 .bell{width:32px;height:32px}
 .sidebar{padding:7px 8px}
 .nav{gap:4px}
 .nav-btn{min-height:39px;padding:8px 10px;font-size:12px;gap:7px}
 .nav-btn .ico{width:17px;flex-basis:17px}.nav-btn .ico .svg-icon{width:16px;height:16px}
 .main{padding:16px 12px 26px}
 .page-head{flex-direction:column;align-items:stretch;gap:12px;margin-bottom:16px}
 .page-head>div{width:100%}.page-head h1{font-size:24px}.page-head h2{font-size:21px}.page-head p{font-size:13px}
 .page-head>.btn,.page-head>button{align-self:flex-start}
 .grid-4,.grid-3,.summary-row{grid-template-columns:minmax(0,1fr);gap:11px}
 .grid-3>.panel:first-child{grid-column:auto}
 .kpi{min-height:100px;padding:15px;grid-template-columns:42px minmax(0,1fr) 20px;gap:12px}
 .kpi-icon{width:40px;height:40px}.kpi .label{font-size:12px}.kpi .value{font-size:27px}
 .panel-head{padding:12px 14px;font-size:13px}.panel-body{padding:13px}
 .flow{gap:3px}.flow-dot{width:34px;height:34px;font-size:13px}.flow-step:not(:last-child):after{top:16px}.flow-step b{font-size:10px}.flow-step small{font-size:9px}
 .donut-wrap{gap:14px}.donut{width:105px;height:105px}.donut:before{width:66px;height:66px}.donut-center{font-size:19px}.legend-row{font-size:10px}
 .qa-grid{grid-template-columns:minmax(0,1fr)}
 .external{align-items:flex-start;gap:10px;padding:12px}.external .ext-icon{width:38px;height:38px}.external .grow{font-size:13px}
 .toolbar{align-items:stretch;flex-wrap:wrap}.toolbar .search-wrap{flex-basis:100%;order:-1}.toolbar>.btn,.toolbar>button{flex:1}
 .table-title{align-items:flex-start;padding:12px;font-size:13px}
 .table-wrap{overflow-x:auto}table{min-width:720px}
 .pagination{align-items:flex-start;flex-direction:column;padding:11px;gap:9px}
 .filters{padding:13px}.filter-grid,.form-grid-2,.form-grid-3{grid-template-columns:minmax(0,1fr);gap:12px}
 .filter-actions{align-items:stretch;flex-direction:column}.filter-actions .right{width:100%}.filter-actions .right .btn{flex:1}
 .tabs{margin-bottom:12px}.tab{padding:10px 12px;font-size:12px}.subtabs{gap:6px}
 .steps{justify-content:flex-start;overflow-x:auto;padding:2px 0 8px}.step{flex:0 0 92px;font-size:10px}
 .dataset-meta{grid-template-columns:minmax(0,1fr)}
 .kv{grid-template-columns:minmax(0,1fr);gap:3px}.kv b{margin-top:8px}
 .perm-row{grid-template-columns:minmax(0,1fr) 70px 70px;padding:9px;font-size:11px}
 .modal-backdrop{place-items:end center;padding:0}
 .modal,.modal.sm,.modal.lg,.modal.wizard{width:100%;max-height:94dvh;border-radius:16px 16px 0 0}
 .modal-head{padding:14px 16px}.modal-head h3{font-size:17px}
 .modal-body{padding:16px;overflow-y:auto}.modal-foot{padding:12px 16px;gap:8px;flex-wrap:wrap}
 .modal-foot>.right{flex:1;justify-content:flex-end}.modal-foot .btn{min-height:40px}
 .mobile-note{display:block;margin-bottom:12px;padding:10px 12px;border-radius:8px;background:#fff6df;color:#805b10;font-size:12px}
 .empty{padding:36px 16px}
 .toast{right:12px;bottom:12px}
}
@media(max-width:390px){
 .brand{width:112px;padding:0 10px;font-size:15px}
 .topbar{padding-left:119px;padding-right:7px}
 .nav-btn{padding:8px;font-size:11px}
 .nav-btn .ico{display:none}
 .main{padding:13px 9px 22px}
 .btn{padding:9px 11px;font-size:12px}
 .flow-step b{font-size:9px}.flow-step small{font-size:8px}
 .modal-foot{align-items:stretch}.modal-foot>.btn,.modal-foot>.right{width:100%}.modal-foot .right .btn{flex:1}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

function initials(name){return name.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function digits(v=''){return String(v).replace(/\D/g,'')}
function parseBrDate(v=''){const m=String(v).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?new Date(Number(m[3]),Number(m[2])-1,Number(m[1])):null}
function clearFieldError(id){const el=$('#'+id);if(!el)return;el.removeAttribute('aria-invalid');const field=el.closest('.field');if(field){field.classList.remove('has-error');field.querySelector('.field-error')?.remove()}}
function setFieldError(id,msg='Campo obrigatório.'){const el=$('#'+id);if(!el)return false;clearFieldError(id);el.setAttribute('aria-invalid','true');const field=el.closest('.field');if(field){field.classList.add('has-error');const e=document.createElement('div');e.className='field-error';e.textContent=msg;field.appendChild(e)}return false}
function clearAllFieldErrors(root=document){root.querySelectorAll?.('.field.has-error').forEach(f=>{f.classList.remove('has-error');f.querySelector('.field-error')?.remove()});root.querySelectorAll?.('[aria-invalid="true"]').forEach(el=>el.removeAttribute('aria-invalid'))}
function validateRequired(ids,msg='Preencha os campos obrigatórios.'){clearAllFieldErrors($('.modal')||document);let ok=true,first=null;ids.forEach(id=>{const el=$('#'+id);if(!el)return;const val=el.type==='checkbox'?el.checked:String(el.value||'').trim();if(!val){ok=false;setFieldError(id,el.type==='checkbox'?'Confirme esta opção para continuar.':'Campo obrigatório.');if(!first)first=el}});if(!ok){toast(msg,'error');first?.focus()}return ok}
function setButtonBusy(btn,busy,label='Consultando...'){if(!btn)return;if(busy){btn.dataset.originalHtml=btn.innerHTML;btn.disabled=true;btn.classList.add('is-loading');btn.innerHTML=`<span class="spinner" aria-hidden="true"></span>${label}`}else{btn.disabled=false;btn.classList.remove('is-loading');if(btn.dataset.originalHtml)btn.innerHTML=btn.dataset.originalHtml}}
function orgSuperiorOptions(currentName='',selected=''){const names=state.data.orgs.map(o=>o.name).filter(n=>n!==currentName);const opts=['','Não se aplica',...names];return opts.map(o=>`<option value="${esc(o)}" ${o===selected?'selected':''}>${o||'Selecione'}</option>`).join('')}
function createsOrgCycle(currentName,superiorName){if(!currentName||!superiorName||superiorName==='Não se aplica')return false;let cursor=superiorName,seen=new Set();while(cursor&&cursor!=='Não se aplica'&&!seen.has(cursor)){if(cursor===currentName)return true;seen.add(cursor);const o=state.data.orgs.find(x=>x.name===cursor);cursor=o?.superior||''}return false}

function datasetTypeBadge(type){return `<span class="dataset-type">${icon('external')} ${esc(type||'Conectagov')}</span>`}
function datasetPagesMarkup(total,page,pageSize){
  const pages=Math.max(1,Math.ceil(total/pageSize)); page=Math.min(page,pages);
  const buttons=[]; for(let p=1;p<=pages;p++)buttons.push(`<button class="page ${p===page?'active':''}" data-dataset-page="${p}">${p}</button>`);
  return `<button class="page" data-dataset-page="first" ${page<=1?'disabled':''}>«</button><button class="page" data-dataset-page="prev" ${page<=1?'disabled':''}>‹</button>${buttons.join('')}<button class="page" data-dataset-page="next" ${page>=pages?'disabled':''}>›</button><button class="page" data-dataset-page="last" ${page>=pages?'disabled':''}>»</button>`;
}
function renderDatasets(){

  $$('[data-dataset-page]').forEach(b=>b.onclick=()=>{if(b.disabled)return;const pages=Math.max(1,Math.ceil(getFilteredDatasets().length/(state.datasetPageSize||10))),v=b.dataset.datasetPage;if(v==='first')state.datasetPage=1;else if(v==='prev')state.datasetPage=Math.max(1,state.datasetPage-1);else if(v==='next')state.datasetPage=Math.min(pages,state.datasetPage+1);else if(v==='last')state.datasetPage=pages;else state.datasetPage=Number(v);render()});

  $('#modal-root').innerHTML=html; bindModalClose(); renderDatasetTokens();

  const add=(kind)=>{const input=$(`#ds-${kind==='operations'?'op':'attr'}-input`),v=(input?.value||'').trim();if(!v)return;if(!datasetFormState[kind].some(x=>x.toLowerCase()===v.toLowerCase()))datasetFormState[kind].push(v);input.value='';if(kind==='operations')clearFieldError('ds-op-input');renderDatasetTokens();input?.focus()};
  $('#ds-add-op')?.addEventListener('click',()=>add('operations'));$('#ds-add-attr')?.addEventListener('click',()=>add('attributes'));

function renderDatasetTokens(){
  const renderTokens=(items,kind)=>items.length?items.map((v,i)=>`<span class="dataset-token">${esc(v)}<button type="button" aria-label="Remover ${esc(v)}" data-remove-dataset-token="${kind}:${i}">${icon('x')}</button></span>`).join(''):`<span class="dataset-empty-token">Nenhum item adicionado.</span>`;
  if($('#ds-op-tokens'))$('#ds-op-tokens').innerHTML=renderTokens(datasetFormState?.operations||[],'operations');if($('#ds-attr-tokens'))$('#ds-attr-tokens').innerHTML=renderTokens(datasetFormState?.attributes||[],'attributes');
  $$('[data-remove-dataset-token]').forEach(b=>b.onclick=()=>{const [kind,idx]=b.dataset.removeDatasetToken.split(':');datasetFormState[kind].splice(Number(idx),1);renderDatasetTokens()});
}
function saveDataset(item){
  clearAllFieldErrors($('.dataset-drawer')||document);let ok=true,first=null;const need=(id,msg='Campo obrigatório.')=>{const el=$('#'+id);if(!String(el?.value||'').trim()){setFieldError(id,msg);ok=false;if(!first)first=el}};
  ['ds-name','ds-desc','ds-org','ds-type','ds-period','ds-email'].forEach(id=>need(id));const email=$('#ds-email')?.value.trim()||'';if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){setFieldError('ds-email','Informe um e-mail válido.');ok=false;if(!first)first=$('#ds-email')}
  if(!datasetFormState?.operations?.length){setFieldError('ds-op-input','Adicione pelo menos uma operação.');ok=false;if(!first)first=$('#ds-op-input')}
  if(!ok){toast('Revise os campos destacados antes de salvar.','error');first?.focus();return}
  const data={name:$('#ds-name').value.trim(),description:$('#ds-desc').value.trim(),org:$('#ds-org').value.trim(),type:$('#ds-type').value,period:$('#ds-period').value,contact:email,operations:[...datasetFormState.operations],attributes:[...datasetFormState.attributes]};
  if(item){Object.assign(item,data);toast('Conjunto de dados atualizado com sucesso.','success')}else{state.data.datasets.unshift({id:`DS-${String(state.data.datasets.length+1).padStart(3,'0')}`,...data});state.datasetPage=1;toast('Conjunto de dados cadastrado com sucesso.','success')}
  closeModal();render();
}


function parseReportDate(v=''){const m=String(v).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?new Date(Number(m[3]),Number(m[2])-1,Number(m[1])):new Date(0)}
function getFilteredReports(){
  const q=state.reportSearch.trim().toLowerCase();
  let rows=state.data.reports.filter(r=>(!q||`${r.title} ${r.type}`.toLowerCase().includes(q))&&(!state.reportType||r.type===state.reportType));
  rows=[...rows].sort((a,b)=>state.reportSort==='old'?parseReportDate(a.date)-parseReportDate(b.date):state.reportSort==='title'?a.title.localeCompare(b.title,'pt-BR'):parseReportDate(b.date)-parseReportDate(a.date));
  return rows;
}

function renderRequests(){
  const filtered=getFilteredRequests(),counts=countRequests(),size=state.reqPageSize||5,pages=Math.max(1,Math.ceil(filtered.length/size));state.reqPage=Math.min(state.reqPage,pages);const start=(state.reqPage-1)*size,pageRows=filtered.slice(start,start+size),from=filtered.length?start+1:0,to=Math.min(start+size,filtered.length);
  return `<section class="requests-page"><div class="page-head"><div><h2>Solicitações de Acesso a Dados</h2><p>Gerencie e acompanhe todas as solicitações de acesso a conjuntos de dados</p></div><button class="btn btn-primary" id="new-request">${icon('plus')} Nova solicitação</button></div>

function countRequests(){const a=getFilteredRequests();return {total:a.length,analysis:a.filter(x=>x.status==='Em análise').length,approved:a.filter(x=>x.status==='Aprovada').length,denied:a.filter(x=>x.status==='Negado').length}}
function getFilteredRequests(){
  const s=state.reqSearch.toLowerCase().trim(),f=state.reqFilters;
  const start=f.start?new Date(`${f.start}T00:00:00`):null,end=f.end?new Date(`${f.end}T23:59:59`):null;
  return state.data.requests.filter(r=>{
    const hit=!s||[r.id,r.dataset,r.cedente,r.solicitante,r.volume,r.tipo].join(' ').toLowerCase().includes(s);
    const d=parseBrDate(r.date);const dateOk=(!start||!d||d>=start)&&(!end||!d||d<=end);
    const sphere=r.sphere||'Federal';
    return hit&&(!f.status||r.status===f.status)&&(!f.cedente||r.cedente===f.cedente)&&(!f.solicitante||r.solicitante===f.solicitante)&&(!f.type||r.tipo===f.type)&&(!f.sphere||sphere===f.sphere)&&dateOk;
  });
}
function requestRow(r){return `<tr><td class="strong">${r.id}</td><td class="doc-cell">${icon('file')}<span>${r.dataset}</span></td><td>${r.cedente}</td><td>${r.solicitante}</td><td>${r.tipo}</td><td>${r.volume}</td><td>${r.date}</td><td>${badgeStatus(r.status)}</td><td class="actions-col"><button class="icon-btn action-icon more-action" aria-label="Mais ações da solicitação ${r.id}" data-tooltip="Mais ações" data-request-actions="${r.id}">${icon('more')}</button></td></tr>`}

    ${selectField('Status','f-status',['','Em análise','Em triagem','Aguardando complementação','Aprovada','Em disponibilização','Concluída','Negado','Pendente'],f.status)}${selectField('Órgão Cedente','f-cedente',['','Receita Federal','Dataprev','IBGE','Ministério da Saúde','INSS','INEP','Polícia Federal','Caixa Econômica Federal'],f.cedente)}${selectField('Órgão Solicitante','f-solicitante',['','Ministério da Fazenda','Ministério da Saúde','Ministério do Desenvolvimento Social','Ministério da Gestão','Ministério da Educação','Ministério da Justiça','IBGE'],f.solicitante)}${selectField('Tipo da Solicitação','f-type',['','Adesão','Alteração de Volumetria'],f.type)}${selectField('Esfera Administrativa','f-sphere',['','Federal','Estadual','Municipal'],f.sphere)}<div class="field"><label>Período da Solicitação</label><div style="display:flex;gap:7px"><input type="date" id="f-start" value="${f.start||''}"><input type="date" id="f-end" value="${f.end||''}"></div></div>

function selectField(label,id,opts,val='',required=false,disabled=false){return `<div class="field"><label class="${required?'req':''}">${label}</label><select id="${id}" ${disabled?'disabled':''}>${opts.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${o||'Selecione'}</option>`).join('')}</select></div>`}

function openRequestActionMenu(button,id){
  closeActionMenu();

  document.body.appendChild(menu);

  menu.setAttribute('role','menu');menu.querySelectorAll('.action-menu-item').forEach(x=>x.setAttribute('role','menuitem'));menu.addEventListener('keydown',e=>{const items=[...menu.querySelectorAll('.action-menu-item')],idx=items.indexOf(document.activeElement);if(e.key==='Escape'){e.preventDefault();closeActionMenu();button.focus()}if(e.key==='ArrowDown'){e.preventDefault();items[(idx+1+items.length)%items.length]?.focus()}if(e.key==='ArrowUp'){e.preventDefault();items[(idx-1+items.length)%items.length]?.focus()}});menu.querySelector('.action-menu-item')?.focus();
  setTimeout(()=>document.addEventListener('click',closeActionMenu,{once:true}),0);

function downloadRequestDocument(type,id){
  const r=state.data.requests.find(x=>x.id===id);if(!r)return;
  const base=[`Protocolo: ${r.id}`,`Conjunto de Dados: ${r.dataset}`,`Órgão Cedente: ${r.cedente}`,`Órgão Solicitante: ${r.solicitante}`,`Tipo: ${r.tipo}`,`Volumetria: ${r.volume}`,`Data da Solicitação: ${r.date}`,`Data Final: ${r.final||'Não informada'}`,`Status: ${r.status}`];
  if(type==='auth')base.push(`Data de Aprovação: ${r.approvalDate||r.final||'Não informada'}`);
  const title=type==='auth'?'AUTORIZAÇÃO DE COMPARTILHAMENTO':'SOLICITAÇÃO DE COMPARTILHAMENTO';
  downloadText(type==='auth'?`Autorizacao_${id}.txt`:`Solicitacao_${id}.txt`,`${title}\n\n${base.join('\n')}\n\nDocumento demonstrativo do protótipo ConectaHub.`);
}
function exportRequests(){const rows=getFilteredRequests();const csv=['ID;Conjunto de Dados;Órgão Cedente;Órgão Solicitante;Tipo;Volumetria;Data;Status',...rows.map(r=>[r.id,r.dataset,r.cedente,r.solicitante,r.tipo,r.volume,r.date,r.status].join(';'))].join('\n');downloadText('solicitacoes_exportadas.csv',csv);toast('Exportação gerada respeitando os filtros aplicados.','success')}
function downloadText(name,text){const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}

PD','Documentos'])}`;
  const canAct=!['Negado','Concluída'].includes(r.status);
  openModal('Acompanhamento da solicitação',body,{size:'lg',footer:`<button class="btn btn-secondary" data-close>Fechar</button><div class="right"><button class="btn btn-secondary" id="dl-req">${icon('download')} Baixar solicitação</button>${r.status==='Aprovada'||r.status==='Em disponibilização'||r.status==='Concluída'?`<button class="btn btn-secondary" id="dl-auth">${icon('file')} Baixar autorização</button>`:''}${canAct?`<button class="btn btn-primary" id="detail-update">${icon('arrowRight')} Atualizar etapa</button>`:''}</div>`});

function renderRequestComments(r){const comments=Array.isArray(r.comments)?r.comments:[];if(!comments.length)return '<p class="request-comments-empty">Nenhum comentário adicionado ainda.</p>';return comments.map(c=>`<div class="request-comment-item"><div class="request-comment-avatar">U</div><div class="request-comment-content"><div class="request-comment-meta"><b>${esc(c.actor||'Usuário')}</b><span>${esc(c.date||'Agora')}</span></div><p>${esc(c.text||'')}</p></div></div>`).join('')}
function nextRequestAction(status){return ({'Pendente':'Realizar triagem','Em análise':'Concluir análise e decidir','Em triagem':'Analisar requisitos','Aguardando complementação':'Aguardar resposta do solicitante','Aprovada':'Disponibilizar dados','Em disponibilização':'Confirmar disponibilização','Concluída':'Nenhuma — processo concluído','Negado':'Nenhuma — decisão registrada'})[status]||'Verificar solicitação'}
function openRequestTransition(id,status){
  const r=state.data.requests.find(x=>x.id===id);if(!r)return;

  const title=({ 'Em triagem':'Iniciar triagem','Aguardando complementação':'Solicitar complementação','Em análise':'Retomar análise','Aprovada':'Aprovar solicitação','Negado':'Negar solicitação','Em disponibilização':'Encaminhar para disponibilização','Concluída':'Concluir solicitação'})[status]||'Atualizar solicitação';
  const body=`<div class="note">A etapa será alterada para <b>${esc(status)}</b>. A movimentação ficará registrada no histórico desta solicitação.</div>${needsReason?`<div class="field"><label class="req">${status==='Negado'?'Justificativa da negativa':'Informações necessárias para complementar'}</label><textarea id="transition-reason" placeholder="Descreva com clareza os motivos e as orientações para o solicitante..."></textarea><div class="field-hint">Essa informação ficará visível no acompanhamento da solicitação.</div></div>`:`<div class="field"><label>Observação (opcional)</label><textarea id="transition-reason" placeholder="Inclua uma observação sobre esta movimentação..."></textarea></div>`}`;
  openModal(title,body,{size:'sm',footer:`<button class="btn btn-secondary" data-close>Cancelar</button><div class="right"><button class="btn btn-primary" id="confirm-transition">${icon('checkCircle')} Confirmar etapa</button></div>`});
  $('#confirm-transition')?.addEventListener('click',()=>{const reason=$('#transition-reason')?.value.trim()||'';if(needsReason&&!reason){toast('Informe a justificativa para continuar.','error');$('#transition-reason')?.focus();return;}const previous=r.status;r.status=status;r.reason=reason;r.history=Array.isArray(r.history)?r.history:[];r.history.push({status,date:new Date().toLocaleDateString('pt-BR'),actor:'Usuário responsável',note:reason||`Etapa alterada de “${previous}” para “${status}”.`});if(status==='Aprovada')r.approvalDate=new Date().toLocaleDateString('pt-BR');closeModal();render();toast(`Solicitação ${id} atualizada: ${status}.`,'success');});
}

function wizardFooter(){const w=state.wizard;return `${w.step>1?`<button class="btn btn-secondary" id="wiz-back">${icon('arrowLeft')} Voltar</button>`:`<button class="btn btn-secondary" id="wiz-back-pre">${icon('arrowLeft')} Voltar</button>`}<div class="right"><button class="btn btn-primary" id="wiz-next">${w.step===4?'Assinar e enviar':`Próximo ${icon('arrowRight')}`}</button></div>`}
function bindWizard(){
  const w=state.wizard;
  if(w.stage==='search'){
    const input=$('#dataset-search'),results=$('#dataset-results'),notFound=$('#dataset-not-found');
    const updateResults=()=>{
      const term=(input?.value||'').trim().toLowerCase();w.searchTerm=input?.value||'';
      if(term.length<2){results.innerHTML='';if(notFound)notFound.style.display='none';return}
      const matches=(state.data.datasets||[]).filter(d=>[d.name,d.org,d.description,d.type,...(d.attributes||[]),...(d.operations||[])].filter(Boolean).join(' ').toLowerCase().includes(term)).slice(0,8);
      results.innerHTML=matches.length?matches.map(d=>`<div class="dataset-card" style="margin-top:10px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div><b>${esc(d.name)}</b><p class="muted" style="font-size:11px;margin:5px 0">${esc(d.org||'Órgão não informado')}</p><p class="muted" style="font-size:11px;margin:0">${esc(d.description||'')}</p></div><button class="btn btn-primary" data-select-dataset="${esc(d.id)}">Selecionar</button></div></div>`).join(''):`<div class="empty" style="padding:18px 10px"><p>Nenhum conjunto de dados encontrado para “${esc(input.value.trim())}”.</p></div>`;
      if(notFound)notFound.style.display=matches.length?'none':'flex';
      $$('[data-select-dataset]').forEach(btn=>btn.addEventListener('click',()=>{w.dataset=(state.data.datasets||[]).find(d=>d.id===btn.dataset.selectDataset)||null;w.stage='selected';renderWizard()}));
    };
    input?.addEventListener('input',updateResults);updateResults();
    $('#register-missing-dataset')?.addEventListener('click',()=>{const term=input?.value.trim()||'';closeModal();openMissingDatasetForm(term)});
  }
  if(w.stage==='selected'){$('#back-search')?.addEventListener('click',()=>{w.stage='search';renderWizard()});$('#start-steps')?.addEventListener('click',()=>{w.stage='steps';w.step=1;renderWizard()})}
  if(w.stage==='steps'){
    $$('input[name="lgpd"]').forEach(r=>r.onchange=()=>{w.lgpd=r.value;renderWizard()});
    $('#wiz-back-pre')?.addEventListener('click',()=>{w.stage='selected';renderWizard()});
    $('#wiz-back')?.addEventListener('click',()=>{saveWizardFields();w.step--;renderWizard()});
    $('#wiz-next')?.addEventListener('click',()=>{saveWizardFields();if(!validateWizard())return;if(w.step<4){w.step++;renderWizard()}else confirmWizardSend()});
  }
}

function saveWizardFields(){const w=state.wizard;const ids=['benefits','services','policies','population','access','volume','period','delivery','tech','purpose','legal','sensitive','security','dpo','lgpd-tech','accept'];ids.forEach(id=>{const el=$('#'+id);if(el)w.data[id==='lgpd-tech'?'lgpdTech':id]=el.type==='checkbox'?el.checked:el.value})}
function validateWizard(){
  const w=state.wizard;clearAllFieldErrors($('.modal')||document);
  if(w.step===1)return validateRequired(['benefits','services','policies'],'Preencha os campos obrigatórios de Benefícios.');
  if(w.step===2)return validateRequired(['access','volume','period','delivery'],'Preencha os campos obrigatórios da etapa Operacional.');
  if(w.step===3){if(!w.lgpd){const box=$('.radio-row')?.closest('.field');if(box){box.classList.add('has-error');const e=document.createElement('div');e.className='field-error';e.textContent='Selecione Sim ou Não.';box.appendChild(e)}toast('Informe se os dados contêm dados pessoais.','error');return false}if(w.lgpd==='sim')return validateRequired(['purpose','legal','sensitive','security','dpo'],'Preencha os campos obrigatórios de LGPD.');return true}
  if(w.step===4&&!w.data.accept){setFieldError('accept','É necessário aceitar a declaração antes do envio.');toast('É necessário aceitar a declaração para enviar.','error');return false}
  return true;
}
function confirmWizardSend(){openModal('Confirmar envio',`<div class="danger-icon sign">${icon('signature')}</div><p style="text-align:center"><b>Confirma o envio da solicitação?</b></p><p class="muted" style="text-align:center">A solicitação seguirá para análise do órgão cedente.</p>`,{size:'sm',footer:`<button class="btn btn-secondary" data-close>Cancelar</button><div class="right"><button class="btn btn-primary" id="confirm-send">${icon('signature')} Confirmar envio</button></div>`});$('#confirm-send')?.addEventListener('click',()=>{const id=`SOL-2026-${String(state.data.requests.length+1).padStart(3,'0')}`;const chosen=state.wizard.dataset;const chosenRecord=typeof chosen==='object'?chosen:(state.data.datasets||[]).find(d=>d.id===chosen);const datasetName=chosenRecord?.name||'Conjunto de dados não informado';const cedente=chosenRecord?.org||'Órgão não informado';state.data.requests.unshift({id,dataset:datasetName,cedente,solicitante:'Secretaria de Governo Digital',tipo:'Adesão',volume:state.wizard.data.volume,date:new Date().toLocaleDateString('pt-BR'),final:'—',status:'Em análise',sphere:'Federal'});openModal('Solicitação enviada',`<div class="success-state-icon">${icon('checkCircle')}</div><h3 class="success-title">Solicitação enviada com sucesso</h3><p class="muted success-copy">O pedido foi registrado e seguirá para análise do órgão cedente.</p><div class="success-protocol"><small>PROTOCOLO</small><b>${id}</b><span class="badge orange">Em análise</span></div>`,{size:'sm',footer:`<button class="btn btn-secondary" id="success-list">Voltar à Lista</button><div class="right"><button class="btn btn-primary" id="success-view">${icon('eye')} Ver Solicitação</button></div>`});$('#success-list')?.addEventListener('click',()=>{closeModal();state.route='requests';render()});$('#success-view')?.addEventListener('click',()=>{closeModal();state.route='requests';render();openRequestDetail(id)});toast('Solicitação enviada com sucesso.','success')})}
function renderOrgs(){const filtered=getFilteredOrgs();return `<section class="org-page"><div class="page-head"><div><h2>Cadastro de Órgãos e Entidades</h2><p>Gerencie os órgãos cedentes e recebedores cadastrados na plataforma</p></div></div><div class="toolbar"><div class="search-wrap"><input class="search" id="org-search" value="${esc(state.orgSearch)}" placeholder="Buscar por nome, sigla ou CNPJ..."></div><button class="btn btn-secondary icon-only" id="toggle-org-filters" title="Filtros" aria-label="Abrir filtros">${icon('filter')}</button><button class="btn btn-primary" id="new-org">${icon('plus')} Novo órgão</button></div>${renderOrgFilters()}<div class="table-card">${state.data.orgs.length===0?renderOrgEmpty():renderOrgTable(filtered)}</div></section>`}
function getFilteredOrgs(){const raw=state.orgSearch.trim(),s=raw.toLowerCase(),sd=digits(raw),f=state.orgFilters;return state.data.orgs.filter(o=>{const text=[o.name,o.sigla,o.cnpj].join(' ').toLowerCase(),cnpjDigits=digits(o.cnpj);const hit=!s||text.includes(s)||(sd&&cnpjDigits.includes(sd));return hit&&(!f.esfera||o.esfera===f.esfera)&&(!f.uf||o.uf===f.uf)&&(!f.municipio||o.municipio===f.municipio)&&(!f.natureza||o.natureza===f.natureza)})}
function renderOrgTable(rows){const size=state.orgPageSize||5,pages=Math.max(1,Math.ceil(rows.length/size));state.orgPage=Math.min(state.orgPage,pages);const start=(state.orgPage-1)*size,pageRows=rows.slice(start,start+size),from=rows.length?start+1:0,to=Math.min(start+size,rows.length);return `<div class="table-wrap"><table class="org-table"><thead><tr><th>NOME</th><th>SIGLA</th><th>CNPJ</th><th>ESFERA</th><th class="uf-col">UNIDADE DA FEDERAÇÃO</th><th class="actions-col">AÇÕES</th></tr></thead><tbody>${pageRows.length?pageRows.map(o=>`<tr><td class="strong">${o.name}</td><td>${o.sigla}</td><td>${o.cnpj}</td><td>${o.esfera}</td><td class="uf-col">${o.uf}</td><td class="actions-col"><div class="table-actions"><button class="icon-btn action-icon edit-action" aria-label="Editar ${esc(o.name)}" data-tooltip="Editar" data-edit-org="${o.cnpj}">${icon('edit')}</button><button class="icon-btn action-icon delete-action" aria-label="Excluir ${esc(o.name)}" data-tooltip="Excluir" data-del-org="${o.cnpj}">${icon('trash')}</button></div></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty"><div class="empty-icon">${icon('search')}</div><h3>Nenhum resultado encontrado</h3><p>Limpe os filtros ou altere o texto de busca.</p></div></td></tr>`}</tbody></table></div><div class="pagination"><span>Mostrando ${from} a ${to} de ${rows.length} órgãos</span><div class="pages"><button class="page" data-org-page="prev" ${state.orgPage<=1?'disabled':''}>‹</button>${Array.from({length:pages},(_,i)=>`<button class="page ${state.orgPage===i+1?'active':''}" data-org-page="${i+1}">${i+1}</button>`).join('')}<button class="page" data-org-page="next" ${state.orgPage>=pages?'disabled':''}>›</button><select class="page page-size" id="org-page-size"><option value="5" ${size===5?'selected':''}>5 por página</option><option value="10" ${size===10?'selected':''}>10 por página</option></select></div></div>`}
function renderOrgEmpty(){return `<div class="table-wrap"><table class="org-table"><thead><tr><th>NOME</th><th>SIGLA</th><th>CNPJ</th><th>ESFERA</th><th class="uf-col">UNIDADE DA FEDERAÇÃO</th><th class="actions-col">AÇÕES</th></tr></thead><tbody><tr class="org-empty-row"><td colspan="6"><div class="empty"><div class="empty-icon">${icon('building')}</div><h3>Nenhum órgão cadastrado.</h3><button class="btn btn-primary" id="first-org">${icon('plus')} Cadastrar primeiro órgão</button></div></td></tr></tbody></table></div><div class="pagination"><span>0 de 0 órgãos</span></div>`}
function renderOrgFilters(){const f=state.orgFilters;const show=Object.values(f).some(Boolean);return `<div class="card filters ${show?'':'hidden'}" id="org-filters"><div class="table-title" style="padding:0 0 12px;border:0"><span class="title-with-icon">${icon('filter')} Filtros</span><button class="close" id="close-org-filter" aria-label="Fechar filtros">${icon('x')}</button></div><div class="filter-grid">${selectField('Esfera Administrativa','of-esfera',['','Federal','Estadual','Municipal'],f.esfera)}${selectField('Natureza Jurídica','of-natureza',['','Órgão Público do Poder Executivo','Autarquia'],f.natureza)}${selectField('Unidade da Federação','of-uf',['','DF','RJ','SP','PB'],f.uf)}${selectField('Município','of-municipio',['','Brasília','Rio de Janeiro','João Pessoa'],f.municipio)}</div><div class="filter-actions"><button class="link-btn" id="clear-org-filter">Limpar filtros</button><div class="right"><button class="btn btn-secondary" id="cancel-org-filter">Cancelar</button><button class="btn btn-primary" id="apply-org-filter">Aplicar filtros</button></div></div></div>`}
function bindOrgs(){
  $('#org-search')?.addEventListener('input',e=>{state.orgSearch=e.target.value;state.orgPage=1;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();const el=$('#org-search');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},220)});
  $('#toggle-org-filters')?.addEventListener('click',()=>$('#org-filters').classList.toggle('hidden'));$('#close-org-filter')?.addEventListener('click',()=>$('#org-filters').classList.add('hidden'));$('#cancel-org-filter')?.addEventListener('click',()=>$('#org-filters').classList.add('hidden'));
  $('#clear-org-filter')?.addEventListener('click',()=>{state.orgFilters={};state.orgPage=1;render()});
  $('#apply-org-filter')?.addEventListener('click',()=>{state.orgFilters={esfera:$('#of-esfera').value,uf:$('#of-uf').value,municipio:$('#of-municipio').value,natureza:$('#of-natureza').value};state.orgPage=1;render()});
  $('#new-org')?.addEventListener('click',()=>openOrgCreate(false));$('#first-org')?.addEventListener('click',()=>openOrgCreate(false));$$('[data-edit-org]').forEach(b=>b.onclick=()=>openOrgEdit(b.dataset.editOrg));$$('[data-del-org]').forEach(b=>b.onclick=()=>openOrgDelete(b.dataset.delOrg));
  $$('[data-org-page]').forEach(b=>b.onclick=()=>{if(b.disabled)return;const pages=Math.max(1,Math.ceil(getFilteredOrgs().length/(state.orgPageSize||5))),v=b.dataset.orgPage;if(v==='prev')state.orgPage=Math.max(1,state.orgPage-1);else if(v==='next')state.orgPage=Math.min(pages,state.orgPage+1);else state.orgPage=Number(v);render()});
  $('#org-page-size')?.addEventListener('change',e=>{state.orgPageSize=Number(e.target.value);state.orgPage=1;render()});
}
function orgForm(o={},create=true,consulted=false){
  const sourceLocked=!consulted&&!o.name,sourceReadonly=consulted||!create;const currentName=o.name||'';const selectedSuperior=(o.superior&&o.superior!=='Sim'&&o.superior!=='Não')?o.superior:'';
  return `<div class="field"><label class="req">CNPJ</label><div class="consult-row"><input id="org-cnpj" value="${esc(o.cnpj||'')}" placeholder="00.000.000/0000-00" ${!create||consulted?'disabled':''}><button class="btn ${consulted?'btn-secondary':'btn-primary'}" id="consult-cnpj" ${!create||consulted?'disabled':''}>${icon('search')} Consultar</button></div>${consulted?`<div class="success-line">${icon('checkCircle')} Dados encontrados na fonte cadastral.</div>`:`<div class="field-hint hint-icon">${icon('info')} Informe um CNPJ válido com 14 dígitos para consultar os dados cadastrais.</div>`}</div><div class="form-grid-3">${selectField('Esfera Administrativa','org-esfera',['','Federal','Estadual','Municipal'],o.esfera||'',true,sourceReadonly||sourceLocked)}${selectField('Natureza Jurídica','org-natureza',['','Órgão Público do Poder Executivo','Autarquia'],o.natureza||'',true,sourceReadonly||sourceLocked)}${selectField('Unidade da Federação','org-uf',['','DF','RJ','SP','PB'],o.uf||'',true,sourceReadonly||sourceLocked)}${selectField('Município','org-municipio',['','Brasília','Rio de Janeiro','João Pessoa'],o.municipio||'',false,sourceReadonly||sourceLocked)}<div class="field"><label>Código IBGE</label><input id="org-ibge" value="${esc(o.ibge||'')}" ${sourceLocked?'disabled':sourceReadonly?'readonly':''}></div><div class="field"><label class="req">Nome</label><input id="org-name" value="${esc(o.name||'')}" ${sourceLocked?'disabled':sourceReadonly?'readonly':''}></div><div class="field"><label>Sigla</label><input id="org-sigla" value="${esc(o.sigla||'')}" ${sourceLocked?'disabled':''}></div><div class="field"><label>Órgão Pai</label><input id="org-parent" value="${esc(o.parent||'')}" ${sourceLocked?'disabled':sourceReadonly?'readonly':''}></div><div class="field"><label class="req">Órgão Superior no Sistema</label><select id="org-superior" ${sourceLocked?'disabled':''}>${orgSuperiorOptions(currentName,selectedSuperior)}</select><div class="field-hint">Selecione um órgão já cadastrado ou “Não se aplica”.</div></div></div>`
}
function openOrgCreate(consulted=false,cnpj=''){const o=consulted?{cnpj:cnpj||'42.498.733/0001-48',esfera:'Municipal',natureza:'Órgão Público do Poder Executivo',uf:'RJ',municipio:'Rio de Janeiro',ibge:'3304557',name:'Prefeitura do Rio de Janeiro',sigla:'PCRJ',parent:'Município do Rio de Janeiro (vínculo institucional)',superior:''}:{};openModal('Novo órgão ou entidade',orgForm(o,true,consulted),{size:'lg',footer:`<span class="muted">* Campos obrigatórios</span><div class="right"><button class="btn btn-secondary" data-close>Cancelar</button><button class="btn btn-primary" id="save-org" ${consulted?'':'disabled'}>${icon('save')} Cadastrar</button></div>`});
  const updateSave=()=>{const save=$('#save-org');if(save&&consulted)save.disabled=!$('#org-superior')?.value};$('#org-superior')?.addEventListener('change',()=>{clearFieldError('org-superior');updateSave()});updateSave();
  $('#consult-cnpj')?.addEventListener('click',()=>{const input=$('#org-cnpj'),btn=$('#consult-cnpj'),raw=input?.value||'',d=digits(raw);clearFieldError('org-cnpj');if(d.length!==14){setFieldError('org-cnpj','Informe um CNPJ válido com 14 dígitos.');toast('CNPJ inválido. Verifique os 14 dígitos.','error');input?.focus();return}if(state.data.orgs.some(x=>digits(x.cnpj)===d)){setFieldError('org-cnpj','Já existe um órgão ou entidade cadastrado com este CNPJ.');toast('CNPJ já cadastrado.','error');return}setButtonBusy(btn,true);setTimeout(()=>{if(d.startsWith('99')){setButtonBusy(btn,false);setFieldError('org-cnpj','Não foi possível localizar os dados deste CNPJ na fonte cadastral.');toast('CNPJ não localizado.','error');return}openOrgCreate(true,raw)},420)});
  $('#save-org')?.addEventListener('click',()=>{const obj=readOrgForm();if(!validateRequired(['org-name','org-esfera','org-natureza','org-uf','org-superior'],'Revise os campos obrigatórios do órgão.'))return;if(createsOrgCycle(obj.name,obj.superior)){setFieldError('org-superior','A seleção cria uma relação hierárquica circular.');toast('Não é permitido criar relação hierárquica circular.','error');return}if(state.data.orgs.some(x=>digits(x.cnpj)===digits(obj.cnpj))){setFieldError('org-cnpj','Já existe um cadastro com este CNPJ.');return}state.data.orgs.push({...obj,links:0});closeModal();state.orgShowEmpty=false;render();toast('Órgão cadastrado com sucesso.','success')})
}
function readOrgForm(){return {cnpj:$('#org-cnpj').value,esfera:$('#org-esfera').value,natureza:$('#org-natureza').value,uf:$('#org-uf').value,municipio:$('#org-municipio').value,ibge:$('#org-ibge').value,name:$('#org-name').value,sigla:$('#org-sigla').value,parent:$('#org-parent').value,superior:$('#org-superior').value}}
function openOrgEdit(cnpj){const o=state.data.orgs.find(x=>x.cnpj===cnpj);openModal('Editar órgão ou entidade',orgForm(o,false,true)+`<div class="note note-icon">${icon('info')} <span>O CNPJ e os dados provenientes da fonte cadastral não podem ser alterados. Apenas os campos administráveis permanecem editáveis.</span></div>`,{size:'lg',footer:`<span class="muted">* Campos obrigatórios</span><div class="right"><button class="btn btn-secondary" data-close>Cancelar</button><button class="btn btn-primary" id="update-org">${icon('save')} Salvar alterações</button></div>`});$('#update-org')?.addEventListener('click',()=>{const n=readOrgForm();if(!validateRequired(['org-name','org-esfera','org-natureza','org-uf','org-superior'],'Revise os campos obrigatórios do órgão.'))return;if(createsOrgCycle(o.name,n.superior)){setFieldError('org-superior','A seleção cria uma relação hierárquica circular.');toast('Não é permitido criar relação hierárquica circular.','error');return}Object.assign(o,n);closeModal();render();toast('Alterações salvas com sucesso.','success')})}
function openOrgDelete(cnpj){const o=state.data.orgs.find(x=>x.cnpj===cnpj);if(o.links>0){openModal('Exclusão não permitida',`<div class="danger-icon warn">${icon('alert')}</div><p style="text-align:center"><b>Não é possível excluir este órgão ou entidade.</b></p><p class="muted" style="text-align:center">Este órgão ou entidade possui vínculos que impedem a exclusão:</p><div class="kv"><b>Solicitações de acesso a dados</b><span>3</span><b>Conjuntos de dados vinculados</b><span>2</span><b>Gestores cadastrados</b><span>1</span><b>Órgão subordinado</b><span>1</span></div><div class="note">${icon('info')} Para excluir, remova os vínculos existentes e tente novamente.</div>`,{size:'sm',footer:`<span></span><div class="right"><button class="btn btn-secondary" data-close>Fechar</button></div>`});return}openModal('Excluir órgão ou entidade',`<div class="danger-icon">${icon('alert')}</div><p style="text-align:center"><b>Tem certeza que deseja excluir este órgão ou entidade?</b></p><p class="muted" style="text-align:center">Esta ação não poderá ser desfeita.</p><div class="warning-box"><b>${o.name}</b><br><small>CNPJ: ${o.cnpj}</small></div>`,{size:'sm',footer:`<button class="btn btn-secondary" data-close>Cancelar</button><div class="right"><button class="btn btn-danger" id="confirm-del-org">${icon('trash')} Excluir</button></div>`});$('#confirm-del-org')?.addEventListener('click',()=>{state.data.orgs=state.data.orgs.filter(x=>x.cnpj!==cnpj);closeModal();render();toast('Órgão excluído com sucesso.','success')})}

function renderAdmin(){const tabs=[['functionalities','Funcionalidades','list'],['profiles','Perfis','user'],['users','Usuários','users'],['managers','Gestores','users']];return `<section class="admin-page"><div class="page-head"><div><h2>Gestão de Usuários e Perfis</h2><p>${adminSubtitle()}</p></div></div><div class="tabs">${tabs.map(([k,l,ic])=>`<button class="tab ${state.adminTab===k?'active':''}" data-admin-tab="${k}">${icon(ic)} ${l}</button>`).join('')}</div>${adminPanel()}</section>`}
function adminSubtitle(){return state.adminTab==='functionalities'?'Cadastre funcionalidades e gerencie permissões de acesso por perfil.':state.adminTab==='profiles'?'Cadastre perfis e gerencie permissões de acesso por perfil.':state.adminTab==='users'?'Cadastre usuários e gerencie permissões de acesso por perfil.':'Cadastre gestores e vincule-os aos órgãos e perfis correspondentes.'}
function adminPanel(){if(state.adminTab==='functionalities')return adminFunctionalities();if(state.adminTab==='profiles')return adminProfiles();if(state.adminTab==='users')return adminUsers();return adminManagers()}
function adminToolbar(placeholder,buttonLabel){return `<div class="toolbar"><div class="search-wrap"><input class="search" id="admin-search" value="${esc(state.adminSearch)}" placeholder="${placeholder}"></div><button class="btn btn-secondary icon-only" title="Filtros">${icon('filter')}</button><button class="btn btn-primary" id="admin-new">${icon('plus')} ${buttonLabel}</button></div>`}
function filterAdmin(rows,fields){const s=state.adminSearch.toLowerCase().trim();return rows.filter(r=>!s||fields.map(f=>Array.isArray(r[f])?r[f].join(' '):r[f]).join(' ').toLowerCase().includes(s))}
function adminFunctionalities(){const rows=filterAdmin(state.data.functionalities,['name','module']);return `${adminToolbar('Buscar funcionalidade...','Nova funcionalidade')}<div class="table-card"><div class="table-title"><span>Funcionalidades cadastradas &nbsp;<span class="pill">${rows.length}</span></span></div><div class="table-wrap"><table><thead><tr><th>FUNCIONALIDADE</th><th>MÓDULO</th><th>PERFIS VINCULADOS</th><th>STATUS</th><th class="actions-col">AÇÕES</th></tr></thead><tbody>${rows.length?rows.map(f=>`<tr><td><b>${f.name}</b><div class="muted">${f.desc}</div></td><td>${f.module}</td><td><span class="pill">${f.profiles} ${f.profiles===1?'perfil':'perfis'}</span></td><td>${badgeStatus(f.status)}</td><td class="actions-col"><div class="table-actions"><button class="icon-btn action-icon edit-action" aria-label="Editar ${esc(f.name)}" data-tooltip="Editar" data-edit-func="${esc(f.name)}">${icon('edit')}</button><button class="icon-btn action-icon delete-action" aria-label="Excluir ${esc(f.name)}" data-tooltip="Excluir" data-del-func="${esc(f.name)}">${icon('trash')}</button></div></td></tr>`).join(''):adminEmptyRow(5,'Nenhuma funcionalidade encontrada')}</tbody></table></div>${adminPagination(rows.length)}</div>`}
function adminProfiles(){const rows=filterAdmin(state.data.profiles,['name','desc']);return `${adminToolbar('Buscar perfil por nome...','Novo perfil')}<div class="table-card"><div class="table-title"><span>Perfis cadastrados &nbsp;<span class="pill">${rows.length}</span></span></div><div class="table-wrap"><table><thead><tr><th>PERFIL</th><th>DESCRIÇÃO</th><th>MÓDULOS</th><th>STATUS</th><th class="actions-col">AÇÕES</th></tr></thead><tbody>${rows.length?rows.map(p=>`<tr><td><div class="person"><div class="avatar-sm">${initials(p.name)}</div><b>${p.name}</b></div></td><td>${p.desc}</td><td>${p.modules}</td><td>${badgeStatus(p.status)}</td><td class="actions-col"><div class="table-actions"><button class="icon-btn action-icon edit-action" aria-label="Editar ${esc(p.name)}" data-tooltip="Editar" data-edit-profile="${esc(p.name)}">${icon('edit')}</button><button class="icon-btn action-icon delete-action" aria-label="Excluir ${esc(p.name)}" data-tooltip="Excluir" data-del-profile="${esc(p.name)}">${icon('trash')}</button></div></td></tr>`).join(''):adminEmptyRow(5,'Nenhum perfil encontrado')}</tbody></table></div>${adminPagination(rows.length)}</div>`}
function adminUsers(){const rows=filterAdmin(state.data.users,['name','email','cpf']);return `${adminToolbar('Buscar usuário por nome, CPF ou e-mail...','Novo usuário')}<div class="table-card"><div class="table-title"><span>Usuários cadastrados &nbsp;<span class="pill">${rows.length}</span></span></div><div class="table-wrap"><table><thead><tr><th>USUÁRIO</th><th>E-MAIL</th><th>PERFIS</th><th>STATUS</th><th class="actions-col">AÇÕES</th></tr></thead><tbody>${rows.length?rows.map(u=>`<tr><td><div class="person"><div class="avatar-sm">${initials(u.name)}</div><b>${u.name}</b></div></td><td>${u.email}</td><td><span class="pill">${u.profiles.length} ${u.profiles.length===1?'perfil':'perfis'}</span></td><td>${badgeStatus(u.status)}</td><td class="actions-col"><div class="table-actions"><button class="icon-btn action-icon edit-action" aria-label="Editar ${esc(u.name)}" data-tooltip="Editar" data-edit-user="${esc(u.email)}">${icon('edit')}</button><button class="icon-btn action-icon delete-action" aria-label="Excluir ${esc(u.name)}" data-tooltip="Excluir" data-del-user="${esc(u.email)}">${icon('trash')}</button></div></td></tr>`).join(''):adminEmptyRow(5,'Nenhum usuário encontrado')}</tbody></table></div>${adminPagination(rows.length)}</div>`}
function adminManagers(){const rows=filterAdmin(state.data.managers,['name','email','cpf','org']);return `${adminToolbar('Buscar gestor por nome, CPF ou e-mail...','Novo gestor')}<div class="table-card"><div class="table-title"><span>Gestores cadastrados &nbsp;<span class="pill">${rows.length}</span></span></div><div class="table-wrap"><table><thead><tr><th>GESTOR</th><th>ÓRGÃO</th><th>PERFIL DE GESTOR</th><th>ATRIBUIÇÃO</th><th>STATUS</th><th class="actions-col">AÇÕES</th></tr></thead><tbody>${rows.length?rows.map(g=>`<tr><td><div class="person"><div class="avatar-sm">${initials(g.name)}</div><div><b>${g.name}</b><div class="muted">${g.email}</div></div></div></td><td>${g.org}</td><td>${g.profile}</td><td>${g.assignment}</td><td>${badgeStatus(g.status)}</td><td class="actions-col"><div class="table-actions"><button class="icon-btn action-icon edit-action" aria-label="Editar ${esc(g.name)}" data-tooltip="Editar" data-edit-manager="${esc(g.cpf)}">${icon('edit')}</button><button class="icon-btn action-icon delete-action" aria-label="Excluir ${esc(g.name)}" data-tooltip="Excluir" data-del-manager="${esc(g.cpf)}">${icon('trash')}</button></div></td></tr>`).join(''):adminEmptyRow(6,'Nenhum gestor encontrado')}</tbody></table></div>${adminPagination(rows.length)}</div>`}
function adminEmptyRow(cols,title='Nenhum resultado encontrado'){return `<tr class="admin-empty-row"><td colspan="${cols}"><div class="empty"><div class="empty-icon">${icon('search')}</div><h3>${title}</h3><p>Revise o texto de busca ou limpe o filtro.</p></div></td></tr>`}
function adminPagination(n){const disabled=n<=10?'disabled':'';return `<div class="pagination"><span>Mostrando ${n?`1 a ${n}`:'0'} de ${n} resultados</span><div class="pages"><button class="page" ${disabled}>«</button><button class="page" ${disabled}>‹</button><button class="page active" ${n?'':'disabled'}>1</button><button class="page" ${disabled}>›</button><button class="page" ${disabled}>»</button><select class="page page-size"><option>10 por página</option></select></div></div>`}
function bindAdmin(){
  $$('[data-admin-tab]').forEach(b=>b.onclick=()=>{state.adminTab=b.dataset.adminTab;state.adminSearch='';render()});
  $('#admin-search')?.addEventListener('input',e=>{state.adminSearch=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();const el=$('#admin-search');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},220)});
  $('#admin-new')?.addEventListener('click',()=>{if(state.adminTab==='functionalities')openFunctionality();if(state.adminTab==='profiles')openProfile();if(state.adminTab==='users')openUser();if(state.adminTab==='managers')openManager()});
  $$('[data-edit-func]').forEach(b=>b.onclick=()=>openFunctionality(state.data.functionalities.find(x=>x.name===b.dataset.editFunc)));
  $$('[data-del-func]').forEach(b=>b.onclick=()=>deleteAdminItem('func',b.dataset.delFunc));
  $$('[data-edit-profile]').forEach(b=>b.onclick=()=>openProfile(state.data.profiles.find(x=>x.name===b.dataset.editProfile)));
  $$('[data-del-profile]').forEach(b=>b.onclick=()=>deleteAdminItem('profile',b.dataset.delProfile));
  $$('[data-edit-user]').forEach(b=>b.onclick=()=>openUser(state.data.users.find(x=>x.email===b.dataset.editUser)));
  $$('[data-del-user]').forEach(b=>b.onclick=()=>deleteAdminItem('user',b.dataset.delUser));
  $$('[data-edit-manager]').forEach(b=>b.onclick=()=>openManager(state.data.managers.find(x=>x.cpf===b.dataset.editManager)));
  $$('[data-del-manager]').forEach(b=>b.onclick=()=>deleteAdminItem('manager',b.dataset.delManager));
}
function openFunctionality(item=null){const edit=!!item;openModal(edit?'Editar funcionalidade':'Nova funcionalidade',`<div class="field"><label class="req">Nome</label><input id="fn-name" value="${esc(item?.name||'')}" placeholder="Ex.: Exportação em massa"></div><div class="field"><label>Descrição (opcional)</label><textarea id="fn-desc" maxlength="500" placeholder="Descreva o que a funcionalidade faz...">${esc(item?.desc||'')}</textarea></div>${selectField('Módulo','fn-module',['','Conjuntos','Solicitações','Órgãos e Entidades','Relatórios','Usuários'],item?.module||'',true)}${selectField('Status','fn-status',['Ativo','Inativo'],item?.status||'Ativo',true)}`,{size:'sm',footer:`<span class="muted">* Campos obrigatórios</span><div class="right"><button class="btn btn-secondary" data-close>Cancelar</button><button class="btn btn-primary" id="save-fn">${icon('save')} ${edit?'Salvar alterações':'Cadastrar'}</button></div>`});$('#save-fn')?.addEventListener('click',()=>{if(!validateRequired(['fn-name','fn-module','fn-status'],'Revise os campos obrigatórios da funcionalidade.'))return;const name=$('#fn-name').value.trim(),module=$('#fn-module').value,status=$('#fn-status').value,desc=$('#fn-desc').value.trim();if(edit)Object.assign(item,{name,module,status,desc});else state.data.functionalities.push({name,module,status,desc,profiles:0});closeModal();render();toast(`Funcionalidade ${edit?'atualizada':'cadastrada'} com sucesso.`,'success')})}
function permissionsHtml(perms={}){return `<div><b style="font-size:12px" class="title-with-icon">Permissões por módulo ${icon('info','inline-info')}</b><div class="muted" style="font-size:11px">Defina as permissões de visualização e edição para cada módulo.</div><div class="perm-table"><div class="perm-row head"><span>MÓDULO</span><span>VISUALIZAR</span><span>EDITAR</span></div>${['Conjuntos','Solicitações','Órgãos','Relatórios','Usuários'].map(m=>{const p=perms[m]||[0,0];return `<div class="perm-row"><span>${m}</span><label><input type="checkbox" data-perm-view="${m}" ${p[0]?'checked':''}> <span class="toggle ${p[0]?'on':''}"></span></label><label><input type="checkbox" data-perm-edit="${m}" ${p[1]?'checked':''}> <span class="toggle ${p[1]?'on':''}"></span></label></div>`}).join('')}</div></div>`}
function openProfile(item=null){const edit=!!item;openModal(edit?'Editar perfil':'Novo perfil',`<div class="field"><label class="req">Nome do perfil</label><input id="pr-name" value="${esc(item?.name||'')}" placeholder="Ex.: Cedente de dados"></div><div class="field"><label>Descrição (opcional)</label><textarea id="pr-desc" maxlength="500" placeholder="Descreva o propósito do perfil...">${esc(item?.desc||'')}</textarea></div>${selectField('Status','pr-status',['Ativo','Inativo'],item?.status||'Ativo',true)}${permissionsHtml(item?.perms||{})}`,{size:'sm',footer:`<span class="muted">* Campos obrigatórios</span><div class="right"><button class="btn btn-secondary" data-close>Cancelar</button><button class="btn btn-primary" id="save-pr">${icon('save')} ${edit?'Salvar alterações':'Cadastrar'}</button></div>`});$$('.perm-row input').forEach(i=>i.onchange=()=>i.nextElementSibling.classList.toggle('on',i.checked));$('#save-pr')?.addEventListener('click',()=>{if(!validateRequired(['pr-name','pr-status'],'Revise os campos obrigatórios do perfil.'))return;const name=$('#pr-name').value.trim(),status=$('#pr-status').value,desc=$('#pr-desc').value.trim();const perms={};['Conjuntos','Solicitações','Órgãos','Relatórios','Usuários'].forEach(m=>perms[m]=[$(`[data-perm-view="${m}"]`).checked,$(`[data-perm-edit="${m}"]`).checked]);if(edit)Object.assign(item,{name,status,desc,perms});else state.data.profiles.push({name,status,desc,perms,modules:'Personalizado'});closeModal();render();toast(`Perfil ${edit?'atualizado':'cadastrado'} com sucesso.`,'success')})}
function profilesChecks(selected=[]){return `<div class="field"><label>Perfis <span class="muted">Selecione os perfis que serão atribuídos a este usuário.</span></label>${state.data.profiles.map(p=>`<label class="checkline"><input type="checkbox" data-user-profile="${esc(p.name)}" ${selected.includes(p.name)?'checked':''}><span><b>${p.name}</b><small>${p.desc}</small></span></label>`).join('')}</div>`}
function openUser(item=null,consulted=!!item){const edit=!!item;const isConsulted=!!item||consulted;openModal(edit?'Editar usuário':'Novo usuário',`<div class="field"><label class="req">CPF</label><div class="consult-row"><input id="us-cpf" value="${esc(item?.cpf||'')}" placeholder="000.000.000-00" ${edit?'disabled':''}><button class="btn btn-secondary" id="consult-user" ${edit?'disabled':''}>${icon('search')} Consultar</button></div><div class="field-hint">Informe um CPF válido com 11 dígitos para preencher Nome e E-mail.</div></div><div class="field"><label class="req">Nome</label><input id="us-name" value="${esc(item?.name||'')}" placeholder="Preenchido pela consulta" ${isConsulted?'readonly':'disabled'}></div><div class="field"><label class="req">E-mail</label><input id="us-email" value="${esc(item?.email||'')}" placeholder="Preenchido pela consulta" ${isConsulted?'readonly':'disabled'}></div>${selectField('Status','us-status',['Ativo','Inativo'],item?.status||'Ativo',true)}${profilesChecks(item?.profiles||[])}`,{size:'sm',footer:`<span class="muted">* Campos obrigatórios</span><div class="right"><button class="btn btn-secondary" data-close>Cancelar</button><button class="btn btn-primary" id="save-us" ${!isConsulted?'disabled':''}>${icon('save')} ${edit?'Salvar alterações':'Cadastrar'}</button></div>`});
  $('#consult-user')?.addEventListener('click',()=>{const cpf=$('#us-cpf'),btn=$('#consult-user'),d=digits(cpf.value);clearFieldError('us-cpf');if(d.length!==11){setFieldError('us-cpf','Informe um CPF válido com 11 dígitos.');toast('CPF inválido.','error');return}setButtonBusy(btn,true);setTimeout(()=>{if(d.startsWith('000')){setButtonBusy(btn,false);setFieldError('us-cpf','CPF não localizado na fonte de identificação.');toast('CPF não localizado.','error');return}$('#us-name').disabled=false;$('#us-name').readOnly=true;$('#us-name').value='João da Silva';$('#us-email').disabled=false;$('#us-email').readOnly=true;$('#us-email').value='joao.silva@orgao.gov.br';$('#save-us').disabled=false;setButtonBusy(btn,false);toast('CPF consultado. Nome e e-mail preenchidos automaticamente.','success')},350)});
  $('#save-us')?.addEventListener('click',()=>{const name=$('#us-name').value.trim(),email=$('#us-email').value.trim(),cpf=$('#us-cpf').value,status=$('#us-status').value,profiles=$$('[data-user-profile]:checked').map(x=>x.dataset.userProfile);if(!validateRequired(['us-cpf','us-name','us-email','us-status'],'Revise os campos obrigatórios do usuário.'))return;if(digits(cpf).length!==11){setFieldError('us-cpf','O CPF deve conter exatamente 11 dígitos.');return}if(edit)Object.assign(item,{name,email,status,profiles});else state.data.users.push({name,email,cpf,status,profiles});closeModal();render();toast(`Usuário ${edit?'atualizado':'cadastrado'} com sucesso.`,'success')})
}
function openManager(item=null){const edit=!!item;let cpfConsulted=edit;const originalCpf=item?.cpf||'';openModal(edit?'Editar gestor':'Novo gestor',`${selectField('Órgão','mg-org',['','Ministério da Saúde','Ministério da Educação','Prefeitura do Rio de Janeiro'],item?.org||'',true)}${selectField('Perfil de gestor','mg-profile',['','Gestor cedente','Gestor recebedor','Gestor administrador'],item?.profile||'',true)}<div class="field"><label class="req">CPF</label><div class="consult-row"><input id="mg-cpf" value="${esc(item?.cpf||'')}" placeholder="000.000.000-00"><button class="btn btn-secondary" id="consult-manager">${icon('search')} Consultar</button></div><div class="field-hint">Informe um CPF válido com 11 dígitos para preencher Nome e E-mail.</div></div><div class="form-grid-2"><div class="field"><label class="req">Nome</label><input id="mg-name" value="${esc(item?.name||'')}" placeholder="Preenchido pela consulta" ${edit?'readonly':'disabled'}></div><div class="field"><label class="req">E-mail</label><input id="mg-email" value="${esc(item?.email||'')}" placeholder="Preenchido pela consulta" ${edit?'readonly':'disabled'}></div>${selectField('Gestor das APIs','mg-api',['','Sim','Não'],item?.api||'',true)}${selectField('Atribuição','mg-assignment',['','Titular','Suplente'],item?.assignment||'',true)}</div>${selectField('Status','mg-status',['Ativo','Inativo'],item?.status||'Ativo',true)}`,{size:'sm',footer:`<span class="muted">* Campos obrigatórios</span><div class="right"><button class="btn btn-secondary" data-close>Cancelar</button><button class="btn btn-primary" id="save-manager" ${edit?'':'disabled'}>${icon('save')} ${edit?'Salvar alterações':'Cadastrar'}</button></div>`});
  $('#mg-cpf')?.addEventListener('input',()=>{if(edit&&$('#mg-cpf').value!==originalCpf){cpfConsulted=false;$('#save-manager').disabled=true;$('#mg-name').value='';$('#mg-email').value='';$('#mg-name').readOnly=false;$('#mg-email').readOnly=false;$('#mg-name').disabled=true;$('#mg-email').disabled=true}});
  $('#consult-manager')?.addEventListener('click',()=>{const cpf=$('#mg-cpf'),btn=$('#consult-manager'),d=digits(cpf.value);clearFieldError('mg-cpf');if(d.length!==11){setFieldError('mg-cpf','Informe um CPF válido com 11 dígitos.');toast('CPF inválido.','error');return}setButtonBusy(btn,true);setTimeout(()=>{if(d.startsWith('000')){setButtonBusy(btn,false);setFieldError('mg-cpf','CPF não localizado na fonte de identificação.');toast('CPF não localizado.','error');return}$('#mg-name').disabled=false;$('#mg-name').readOnly=true;$('#mg-name').value='Roberto Almeida';$('#mg-email').disabled=false;$('#mg-email').readOnly=true;$('#mg-email').value='roberto.almeida@orgao.gov.br';cpfConsulted=true;$('#save-manager').disabled=false;setButtonBusy(btn,false);toast('CPF consultado com sucesso.','success')},350)});
  $('#save-manager')?.addEventListener('click',()=>{const obj={org:$('#mg-org').value,profile:$('#mg-profile').value,cpf:$('#mg-cpf').value,name:$('#mg-name').value.trim(),email:$('#mg-email').value.trim(),api:$('#mg-api').value,assignment:$('#mg-assignment').value,status:$('#mg-status').value};if(!cpfConsulted){setFieldError('mg-cpf','Consulte o CPF antes de salvar.');toast('Consulte o CPF antes de salvar.','error');return}if(!validateRequired(['mg-org','mg-profile','mg-cpf','mg-name','mg-email','mg-api','mg-assignment','mg-status'],'Revise os campos obrigatórios do gestor.'))return;if(digits(obj.cpf).length!==11){setFieldError('mg-cpf','O CPF deve conter exatamente 11 dígitos.');return}if(edit)Object.assign(item,obj);else state.data.managers.push({...obj,links:0});closeModal();render();toast(`Gestor ${edit?'atualizado':'cadastrado'} com sucesso.`,'success')})
}
function deleteAdminItem(type,key){let item,label,links=0;if(type==='func'){item=state.data.functionalities.find(x=>x.name===key);label='funcionalidade';links=item?.profiles||0}if(type==='profile'){item=state.data.profiles.find(x=>x.name===key);label='perfil';links=state.data.users.filter(u=>u.profiles.includes(item.name)).length}if(type==='user'){item=state.data.users.find(x=>x.email===key);label='usuário'}if(type==='manager'){item=state.data.managers.find(x=>x.cpf===key);label='gestor';links=item?.links||0}if(links>0){openModal('Exclusão não permitida',`<div class="danger-icon warn">${icon('alert')}</div><p style="text-align:center"><b>Não é possível excluir este ${label}.</b></p><div class="note">Existem ${links} vínculo(s) impeditivo(s). Remova os vínculos e tente novamente.</div>`,{size:'sm',footer:`<span></span><div class="right"><button class="btn btn-secondary" data-close>Fechar</button></div>`});return}openModal(`Excluir ${label}`,`<div class="danger-icon">${icon('alert')}</div><p style="text-align:center"><b>Tem certeza que deseja excluir este ${label}?</b></p><div class="warning-box">${esc(item.name||item.email||item.cpf)}</div>`,{size:'sm',footer:`<button class="btn btn-secondary" data-close>Cancelar</button><div class="right"><button class="btn btn-danger" id="confirm-admin-delete">${icon('trash')} Excluir</button></div>`});$('#confirm-admin-delete')?.addEventListener('click',()=>{if(type==='func')state.data.functionalities=state.data.functionalities.filter(x=>x!==item);if(type==='profile')state.data.profiles=state.data.profiles.filter(x=>x!==item);if(type==='user')state.data.users=state.data.users.filter(x=>x!==item);if(type==='manager')state.data.managers=state.data.managers.filter(x=>x!==item);closeModal();render();toast(`${label[0].toUpperCase()+label.slice(1)} excluído com sucesso.`,'success')})}

function renderPlaceholder(title,text){return `<div class="page-head"><div><h2>${title}</h2><p>${text}</p></div></div><div class="card empty"><div class="empty-icon">${icon('file')}</div><h3>Fora do escopo visual anexado</h3><p>Este destino foi mantido para preservar a navegação prevista nas Histórias de Usuário e no Dashboard.</p><button class="btn btn-primary" data-route="dashboard">Voltar ao Dashboard</button></div>`}

let modalReturnFocus=null,modalKeyHandler=null;
function openInfo(title,body,size='sm'){openModal(title,body,{size,footer:`<span></span><div class="right"><button class="btn btn-secondary" data-close>Fechar</button></div>`})}
function openModal(title,body,{size='sm',footer=''}={}){modalReturnFocus=document.activeElement;const dialogId='modal-title';const html=`<div class="modal-backdrop"><div class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="${dialogId}" tabindex="-1"><div class="modal-head"><h3 id="${dialogId}">${title}</h3><button class="close" data-close aria-label="Fechar">${icon('x')}</button></div><div class="modal-body">${body}</div><div class="modal-foot">${footer}</div></div></div>`;$('#modal-root').innerHTML=html;bindModalClose()}
function openModalRaw(body,footer='',size='lg'){modalReturnFocus=document.activeElement;let head=`<h3 id="modal-title">Nova Solicitação de Acesso a Dados</h3>`,content=body;const m=body.match(/^<div><div class="strong">[\s\S]*?<\/div><div class="muted"[^>]*>[\s\S]*?<\/div><\/div>/);if(m){head=m[0].replace('class="strong"','class="strong" id="modal-title"');content=body.slice(m[0].length)}const html=`<div class="modal-backdrop"><div class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"><div class="modal-head wizard-head">${head}<button class="close" data-close aria-label="Fechar">${icon('x')}</button></div><div class="modal-body">${content}</div><div class="modal-foot">${footer}</div></div></div>`;$('#modal-root').innerHTML=html;bindModalClose()}
function bindModalClose(){enhanceAccessibility();$$('[data-close]').forEach(b=>b.onclick=closeModal);$('.modal-backdrop')?.addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()});if(modalKeyHandler)document.removeEventListener('keydown',modalKeyHandler);modalKeyHandler=e=>{const modal=$('.modal');if(!modal)return;if(e.key==='Escape'){e.preventDefault();closeModal();return}if(e.key==='Tab'){const focusable=$$('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[href],[tabindex]:not([tabindex="-1"])',modal).filter(el=>el.offsetParent!==null);if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}};document.addEventListener('keydown',modalKeyHandler);requestAnimationFrame(()=>{const first=$('.modal-body input:not([disabled]),.modal-body select:not([disabled]),.modal-body textarea:not([disabled]),.modal-body button:not([disabled]),.modal-foot button:not([disabled])',$('.modal'));(first||$('.modal'))?.focus()})}
function closeModal(){if(modalKeyHandler){document.removeEventListener('keydown',modalKeyHandler);modalKeyHandler=null}$('#modal-root').innerHTML='';if(modalReturnFocus&&document.contains(modalReturnFocus))modalReturnFocus.focus();modalReturnFocus=null}

function systemStateHtml(title,description,iconName='info'){return `<div class="system-state" role="status"><div><div class="state-icon">${icon(iconName)}</div><h3>${esc(title)}</h3><p>${esc(description)}</p></div></div>`}
function routeLabel(){return ({dashboard:'Dashboard',requests:'Solicitações',datasets:'Lista de Dados',reports:'Relatórios',orgs:'Órgãos e Entidades',admin:'Usuários e Perfis'})[state.route]||'Página'}
function announce(message){const el=$('#route-status');if(!el)return;el.textContent='';setTimeout(()=>{el.textContent=message},10)}
function announceRoute(label){document.title=`${label} — Compartilhamento e Interoperabilidade de Dados`;announce(`${label} carregado.`)}
function enhanceAccessibility(){
  document.documentElement.lang='pt-BR';
  document.title=`${routeLabel()} — Compartilhamento e Interoperabilidade de Dados`;
  $$('table').forEach(table=>{table.querySelectorAll('thead th').forEach(th=>th.setAttribute('scope','col'))});
  $$('select:not([aria-label]):not([aria-labelledby])').forEach((el,i)=>{const label=el.closest('.field')?.querySelector('label')?.textContent?.trim();if(label)el.setAttribute('aria-label',label);else if(el.classList.contains('page-size'))el.setAttribute('aria-label','Quantidade de registros por página')});
  $$('input:not([aria-label]):not([aria-labelledby]),textarea:not([aria-label]):not([aria-labelledby])').forEach(el=>{const label=el.closest('.field')?.querySelector('label')?.textContent?.trim();if(label)el.setAttribute('aria-label',label)});
  $$('.table-wrap td').forEach(td=>{if(td.querySelector('button,input,select,a'))return;const txt=td.textContent.replace(/\s+/g,' ').trim();if(txt.length>32&&!td.title)td.title=txt});
  $$('[data-tooltip]').forEach(el=>{if(!el.title)el.title=el.dataset.tooltip||''});
}
function toast(msg,type=''){announce(msg);const root=$('#toast-root');const el=document.createElement('div');el.className=`toast ${type}`;el.setAttribute('role',type==='error'?'alert':'status');el.setAttribute('aria-live',type==='error'?'assertive':'polite');el.textContent=msg;root.appendChild(el);setTimeout(()=>el.remove(),3000)}

// Inicialização do protótipo
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', render, { once: true });
} else {
  render();
}
</script>
</body>
</html>
